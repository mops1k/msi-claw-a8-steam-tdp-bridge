name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch
      prerelease:
        description: Mark as pre-release
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    name: Bump version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.bump.outputs.version }}
      tag: ${{ steps.bump.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bump version files
        id: bump
        run: |
          set -euo pipefail
          chmod +x tools/bump-version.sh
          version="$(tools/bump-version.sh "${{ inputs.bump }}")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Commit and push tag
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PKGBUILD meson.build
          git commit -m "chore: release ${{ steps.bump.outputs.tag }}"
          git tag "${{ steps.bump.outputs.tag }}"
          git push origin "HEAD:${{ github.ref_name }}"
          git push origin "${{ steps.bump.outputs.tag }}"

  build:
    name: Build package and binary
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - name: Build inside Arch container
        run: |
          set -euo pipefail
          tag="${{ needs.prepare.outputs.tag }}"
          docker run --rm -v "$PWD":/work -w /work archlinux:latest bash -euxo pipefail -c "
            pacman -Sy --noconfirm archlinux-keyring
            pacman -Su --noconfirm --needed base-devel meson ninja gcc glib2
            meson setup bin-build --prefix=/usr --buildtype=release
            ninja -C bin-build
            mkdir -p dist
            install -Dm755 bin-build/steam-tdp-bridge dist/steam-tdp-bridge-${tag}-x86_64
            useradd -m builder
            chown -R builder:builder /work
            su builder -c 'cd /work && makepkg -f --nodeps --nocheck'
            cp steam-tdp-bridge-*.pkg.tar.zst dist/
          "

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-files
          path: dist/
          if-no-files-found: error

  release:
    name: Publish release
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-files
          path: dist

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
          PRERELEASE: ${{ inputs.prerelease && '--prerelease' || '' }}
        run: |
          set -euo pipefail
          gh release create "$TAG" \
            --title "$TAG" \
            --generate-notes \
            $PRERELEASE \
            dist/*
