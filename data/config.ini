[tdp]
# firmware-attributes device name (under /sys/class/firmware-attributes)
device=msi-wmi-platform

# Attribute names for the three package power limits
attribute_spl=ppt_pl1_spl
attribute_sppt=ppt_pl2_sppt
attribute_fppt=ppt_pl3_fppt

# platform-profile provider that controls the MSI firmware attributes
platform_profile=msi-wmi-platform

# The MSI EC only enforces the ppt_* limits while the platform profile below
# is active, so "always" is required for TDP to actually take effect.
#   always - keep the profile below while a TDP is active (and re-assert it)
#   auto   - write as-is; only switch on write failure
#   never  - never touch the platform profile (limits likely won't stick)
profile_policy=always

# Profile enforced while a TDP is active (must be in the driver's choices)
profile_name=performance

# Re-assert profile_name if the profile is changed elsewhere (e.g. Steam QAM).
# Used as a fallback when Steam's config can't be read and honor_steam_toggle
# is disabled. With honor_steam_toggle=true the Steam checkbox decides instead.
enforce_profile=false

# Follow Steam's "TDP Limit" checkbox (config/config.vdf -> SteamOS ->
# TDPLimitEnabled): force profile_name only while it is enabled, and release the
# profile when the user turns the limit off.
honor_steam_toggle=true

# Path to Steam's config.vdf. Empty = auto-detect the most recently used one
# under /home/*/.local/share/Steam/config/config.vdf
steam_config=

# Restore the last applied value when the daemon starts
restore_last=true

# Value reported/applied when there is no saved state and the EC still reads 0.
# The TdpLimit1 contract requires a value in [min,max], so 0 is never exposed.
default_limit=15

# Where the last applied value is stored
state_path=/var/lib/steam-tdp-bridge/tdp
