<?xml version="1.0" encoding="UTF-8"?>

<!DOCTYPE busconfig PUBLIC
 "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <!-- Only root may own the bridge service -->
  <policy user="root">
    <allow own="com.steampowered.TdpBridge"/>
  </policy>

  <!-- Anyone may talk to it (steamos-manager relays here) -->
  <policy context="default">
    <allow send_destination="com.steampowered.TdpBridge"/>
  </policy>
</busconfig>
